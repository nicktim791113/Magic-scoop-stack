<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Magic Scoop Stack 🍦 魔法疊疊冰</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover,
                 user-scalable=no, maximum-scale=1" />
  <meta name="description" content="冰淇淋疊疊樂：抓準時機放手，疊得越高分數越高！" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff9ecd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ScoopStack" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-row">
        <div class="pill">分數 <strong id="score">0</strong></div>
        <div class="pill">最高 <strong id="high">0</strong></div>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="420" height="720" aria-label="Magic Scoop Stack"></canvas>

      <!-- 完美對齊提示 -->
      <div id="perfect-pop" aria-hidden="true">PERFECT +2 🍒</div>

      <!-- 開始畫面 -->
      <section id="start-screen" class="overlay">
        <div class="card">
          <h1>🍦 Magic Scoop Stack</h1>
          <p class="sub">魔法疊疊冰</p>
          <ul class="how">
            <li>球在頂端來回擺盪</li>
            <li><b>點擊 / 空白鍵</b> 放手</li>
            <li>對齊下方球可獲得 <b>PERFECT +2</b></li>
            <li>球掉出畫面或整座塔垮就結束</li>
          </ul>
          <button id="btn-start" class="primary">開始遊戲</button>
          <p class="tip">小提示：先慢慢來，把重心壓在中央。</p>
        </div>
      </section>

      <!-- Game Over -->
      <section id="gameover-screen" class="overlay hidden">
        <div class="card">
          <h2>塔垮了 🫠</h2>
          <p class="big">本回合 <strong id="final-score">0</strong> 球</p>
          <p>最高紀錄 <strong id="final-high">0</strong> 球</p>
          <p id="new-high" class="hidden">🎉 新紀錄！</p>
          <button id="btn-restart" class="primary">再來一次</button>
        </div>
      </section>
    </main>

    <footer id="foot">
      <span>Magic Scoop Stack · PWA</span>
    </footer>
  </div>

  <!-- 物理引擎（本地檔案，PWA 離線可用） -->
  <script src="lib/matter.min.js"></script>

  <!-- 遊戲模組（順序很重要：config → 其他） -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/dropper.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
